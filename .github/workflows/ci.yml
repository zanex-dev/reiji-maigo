name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (zero third-party runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps

      - name: Verify Bare-Kernel Mode (REIJI_MAIGO_DISABLE_PLUGINS=1)
        env:
          REIJI_MAIGO_DISABLE_PLUGINS: "1"
        run: python -m unittest discover -s tests -v

      - name: Verify Full-Plugin Mode & Clean-Room Gate (223/223)
        env:
          REIJI_MAIGO_DISABLE_PLUGINS: "0"
        run: python -m unittest discover -s tests -v

      - name: CLI & Six-Dimensional Adversarial Benchmark Smoke Check
        run: |
          reiji --help
          reiji bench run --markdown
